apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: {{ include "api-gateway.fullname" . }}-virtual
spec:
  hosts:
    {{- range .Values.istio.virtualService.hosts }}
    - {{ . }}
    {{- end }}
  http:
    {{- range .Values.istio.virtualService.http }}
    - match:
        {{- range .match }}
        - uri:
            prefix: {{ .uri.prefix }}
        {{- end }}
      {{- if .rewrite }}
      rewrite:
        uri: {{ .rewrite.uri }}
      {{- end }}
      route:
        {{- range .route }}
        - destination:
            host: {{ .destination.host }}
            port:
              number: {{ .destination.port.number }}
        {{- end }}
    {{- end }}
